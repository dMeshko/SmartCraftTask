services:
  sql-server:
    image: "mcr.microsoft.com/azure-sql-edge:1.0.7"
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql
    restart: unless-stopped
    ports:
      - "6433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Runs once, ahead of the API, and exits. Schema is a deployment step: doing it here means one
  # process applies it rather than every replica racing to, and the API never carries the
  # permissions to change a schema it only reads and writes rows in.
  smartcrafttask-migrations:
    image: smartcrafttask-migrations
    build:
      context: .
      dockerfile: src/SmartCraftTask/Dockerfile.Migrations
    environment:
      # Belt and braces with the --migrate in the image's entrypoint. An override that replaces the
      # entrypoint takes the argument with it — Rider's generated compose override does exactly that
      # to every service — whereas environment maps are merged, so this survives.
      - MIGRATE_DATABASE=true
      # No signing key: this process builds a DbContext and nothing else.
      - ConnectionString=Server=tcp:sql-server;Database=${SQL_DATABASE};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Connect Timeout=3
    depends_on:
      sql-server:
        condition: service_healthy
    restart: "no"

  smartcrafttask:
    image: smartcrafttask
    build:
      context: .
      dockerfile: src/SmartCraftTask/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionString=Server=tcp:sql-server;Database=${SQL_DATABASE};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Connect Timeout=3
      - Jwt__Key=${JWT_SIGNING_KEY}
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      # curl is in the image for this. The previous version spoke /dev/tcp from bash because the
      # Debian-based runtime had neither curl nor wget; the Alpine runtime installs curl, so the
      # check says what it means.
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health/ready" ]
      interval: 10s
      # Comfortably past the 3-second connect timeout, so a probe is never killed mid-answer.
      timeout: 5s
      retries: 3
      # Shorter than it was: the app no longer migrates on the way up, so it starts listening
      # almost immediately.
      start_period: 10s
    depends_on:
      # Not just "started": the API waits for the schema to be in place. A failed migration exits
      # non-zero, and the API is then never started at all.
      smartcrafttask-migrations:
        condition: service_completed_successfully

volumes:
  sql-data:
