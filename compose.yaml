services:
  sql-server:
    image: "mcr.microsoft.com/azure-sql-edge:1.0.7"
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql
    restart: unless-stopped
    ports:
      - "6433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  
  smartcrafttask:
    image: smartcrafttask
    build:
      context: .
      dockerfile: SmartCraftTask/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionString=Server=tcp:sql-server;Database=${SQL_DATABASE};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "4443:8081"
    depends_on:
      sql-server:
        condition: service_healthy
volumes:
  sql-data:

